<!DOCTYPE html>
<html>
  <head>
    <title>Positioning Items</title>
    <meta charset="UTF-8" />
    <style>


      * {
        box-sizing: border-box;
      }

      body {
      }

            /* tekee vierekkäin laatikot*/
      .wrapper {
        display: flex;
        height: 300px;
        gap: 20px;
      }




      #header {
        background-color: rgb(22, 3, 3);
        height: 100px;
        width: 100%;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #left
     {
        background-color: rgb(195, 132, 172);
        flex: 1;
        text-align: center;
      }
      #right {
        flex: 4;
        display: flex;
        flex-direction: column;
        text-align: center;
      }

      #top {
        justify-content:start;
        background-color: chocolate;
        flex: 2;
      }

      #bottom {
        justify-content:end;
        flex: 3;
      }

      button {
        background-color: cadetblue;
        height: 30px;
        margin-right: 30px;
      }



      #footer {
        background-color: rgb(187, 187, 179);
        color: black;
        height: 100px;
        width: 100%;
        display: flex;
        /* keskelle x suuntainen justify-content*/
        justify-content: center;
        /* keskelle y suuntainen aling-items*/
        align-items: center;
        }


      main {
        border: 1px solid black;
        max-width: 800px;
        width: 100%;

      }
      #header ul {
        display: flex;
        gap: 10px;
        list-style: none;
        height: 30px;
        justify-content: start;
        align-items: center;
        font-size: 30px;
      }





    </style>
  </head>

  <body>
    <main>
    <div class="header" id="header">
        <ul>
            <li>Etisivu </li>
            <li>Kissa </li>
             <li>Mauku </li>
        </ul>
        <button> Log In</button>
    </div>
    <div class="wrapper">
    <div class="left" id="left">Left</div>
    <div class="right" id="right">
    <div id="top">TOP</div>
    <div id="bottom">BOTTOM<h1>Tänne tulee tekstiä</h1></div>    


    </div>
    </div>
    <div class="footer" id="footer">
    <p> Copyright by Mika</p>
    </div>
    </main>
    


  </body>
</html>
