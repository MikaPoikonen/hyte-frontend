<!doctype html>
<html lang="fi">
  <head>
    <title>Positioning Items</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <nav>
      <ul>
        <li><a href="/login.html">Käyttäjät</a></li>
        <li><a href="/BMI/bmi.html">BMI Laskuri</a></li>
        <li> Hei käyttäjä <span class="username"> Nimi tähän</span></li>

       
      </ul>
    </nav>
    <div id="ylakuva"></div>

    <div>
      Tästä <span id="lightgreen">Projekti Terveyden Puolesta</span> askel kerralla kohti parempaa hyvinvointia! 
    </div>

    <main>
      <h2>Päiväkirjamerkinnät</h2>


      <!-- Tutki formdata javascriptiin-->

        
        <!-- Disablet formiin ei anna muokata kenttää.
         Type: Hidden piilottaa kentän mutta se kulkee mukana esim id:-->
      <form id="add-text-site">


        <label for ="addNewText">Syödyt kalorit</label>
        <input type ="number"
        id ="caloriesEatenInput"
        name ="calories_eaten"
        placeholder="Syödyt kalorit"
        />
         <label for ="addNewText">Kulutetut kalorit</label>
        <input type ="number"
        id ="caloriesUsedInput"
        name = "calories_used"
        placeholder="Kulutetut kalorit"
        />
        <label for ="addNewText">Askeleet</label>
        <input type ="number"
        id ="stepsInput"
        name = "steps"
        placeholder="Askeleet"
        />

        
        <label for ="addNewText">Paino tänään</label>
        <input type ="number"
        id ="weightTodayInput"
        name = "weight_today"
        placeholder="Paino tänään"
        />
        

        <label for ="addNewText">Mikä fiilis ?</label>
        <input type ="text"
        id ="moodInput"
        name = "mood"
        placeholder="Mikä Fiilis?"
        />


        <label for ="addNewText">Alkupaino</label>
        <input type ="number"
        id ="weightInput"
        name = "weight"
        placeholder="Lähtöpaino"
        />

        <label for ="addNewText">Nukutut tunnit</label>
        <input type ="number"
        id ="sleepHoursInput"
        name = "sleep_hours"
        placeholder="Nukutut tunnit"
        />
                
        <label for ="addNewText">Muistiinpanot</label>
        <textarea name="notes" 
        id="notesInput" 
        placeholder="Mitä haluat kirjoittaa ylös ?">awdadasdasd
      </textarea>



        <label for ="addNewText" >Merkinnän id</label>
        <input type ="number"
        disabled
        id ="statIdInput"
        name = "stat_id"
        placeholder="Auto fill"
        hidden
        />

        <label for ="addNewText">Käyttäjä id</label>
        <input type ="number"
        disabled
        id ="userIdInput"
        name = "user_id"
        placeholder="Auto fill"
        />

        <label for ="addNewText">Tapahtuman päivämäärä</label>
        <input type ="date"
        id ="entryDateInput"
        name = "entry_date"
        placeholder="Tapahtumapäivä ?"
        />
        <button type ="submit" style="margin-top:10px ;">Lisää merkintä</button>
      </form> 
      
      <ul id="text-ul">

        
      </ul>

      <div class ="stats">
        Keskiarvot ja tilastot:
        <ul id="stats-ul">
        </ul>

      </div>
  
        
      
    </main>


    
  <!-- kortit tässä -->
<dialog id="myDialog">
  <h2>Päiväkirjamerkinnän muokkaus</h2>
  <p id="dialogId">Tässä on dialogin sisältöä.</p>

  <form method="dialog">
    <button value="cancel">Peruuta</button>
    <button value="ok">OK</button>
  </form>
</dialog>
    
    <footer>Copyright: Mika Poikonen</footer>
    <script type="module" src="/src/js/login.js"></script>
  <script type="module" src="/src/js/paivakirja.js"></script>
  </body>
</html>
