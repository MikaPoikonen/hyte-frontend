<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>

  <body>

    
    <h3>REGISTER</h3>
    <!-- Register form -->
    <form class="registerForm">
      <label for="username">Username</label><!-- Label help to read laber Heads and fields. Also if click header activates form fields -->
      <input
        id="username"
        type="text"
        name="username"
        required
        minlength="3" 
        maxlength="20"
        placeholder="daisy"
      />
      <label for="password">Password</label> 
      <input
        id="password"
        type="password"
        name="password"
        required
        pattern="^(?=.*[A-Z])(?=.*[0-9]).{8,}$"
        placeholder="eXample1"
        title="Isoja ja pieniä kirjaimia ja numeroita. Min 8 merkkiä"
      />
      <label for="password">Email metropolia.fi päätteinen</label>
      <input
        id="email"
        type="email"
        name="email"
        pattern="^[^\s@]+@metropolia\.fi$"
        required
        title="Syötä metropolia.fi-sähköpostiosoite"
        placeholder="example@metropolia.fi"
      />
      <input
        name="submit"
        type="submit"
        value="Add User"
        class="postuser"
      />
      <textarea name="" id="">awdadasdasd</textarea>
    </form>
  </div>

    <h3>LOGIN</h3>
    <!-- Login form -->
    <div>
      <form class="loginForm">
        <label for="username">Username</label>
        <input type="text" name="username" placeholder="name" value="mikafinal" />
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          placeholder="salasana tähän"
          value="testi123"
        />
        <input
          name="submit"
          type="submit"
          value="Login and get new token"
          class="loginform"
        />
      </form>
      <br />
      <div id="loginResponse"></div>
    </div>
    <hr />
    <div>
      <button hidden id="meRequest">Make an "authenticated" request</button>
      <br />
      <div id="meResponse"></div>
    </div>
    <hr />
    <div>
      <button id="clearButton">Clear localStorage</button>
      <br />
      <code id="clearResponse"></code>
    </div>
  </body>

  <script type="module" src="/src/js/logintest.js"></script>
</html>
