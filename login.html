  <body>

    <h3>REGISTER</h3>


    <!-- https://www.w3schools.com/css/css_form.asp -->
   <!-- https://www.w3schools.com/css/tryit.asp?filename=trycss_form_padding -->

   <!-- <pre style="overflow: auto">
    POST http://localhost:3000/api/users
    content-type: application/json

    {
      "username": "daisy",
      "password": "duck",
      "email": "daisy@example.com"
    }
    </pre>*/-->





    <form class="registerForm">
      <label for="username">Username</label><!-- Label help to read laber Heads and fields. Also if click header activates form fields -->
      <input
        id="username"
        type="text"
        name="username"
        required
        minlength="3" 
        maxlength="20"
        placeholder="daisy"
      />
      <label for="password">Password</label> 
      <input
        id="password"
        type="password"
        name="password"
        required
        pattern="^(?=.*[A-Z])(?=.*[0-9]).{8,}$"
        placeholder="eXample1"
        title="Isoja ja pieniä kirjaimia ja numeroita. Min 8 merkkiä"
      />
      <label for="password">Email metropolia.fi päätteinen</label>
      <input
        id="email"
        type="email"
        name="email"
        pattern="^[^\s@]+@metropolia\.fi$"
        required
        title="Syötä metropolia.fi-sähköpostiosoite"
        placeholder="example@metropolia.fi"
      />
      <input
        name="submit"
        type="submit"
        value="Add User"
        class="postuser"
      />
      <textarea name="" id="">awdadasdasd</textarea>
    </form>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Perferendis at quos voluptatem natus est corporis sapiente dolorem qui, voluptatibus, aperiam totam ratione accusamus expedita consequuntur! Doloremque laudantium qui ipsa id!</p>
